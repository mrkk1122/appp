```yaml
name: Build MRKK FastAPI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    defaults:
      run:
        working-directory: mrkk-fastapi-android

    steps:

      # Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # Java 17
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Python 3.11
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # System dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev

      # Python build tools
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel
          python -m pip install buildozer
          python -m pip install "Cython==0.29.37"

      # Verify project
      - name: Verify project
        run: |
          echo "================================"
          echo "Current directory:"
          pwd
          echo "================================"

          echo "Project files:"
          find . -maxdepth 3 -type f | sort

          echo "================================"
          echo "Checking required files..."
          echo "================================"

          test -f buildozer.spec
          echo "✓ buildozer.spec found"

          test -f main.py
          echo "✓ main.py found"

          test -d app
          echo "✓ app directory found"

          test -d services
          echo "✓ services directory found"

      # Build APK
      - name: Build APK
        run: |
          buildozer android debug

      # Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mrkk-fastapi-server-apk
          path: mrkk-fastapi-android/bin/*.apk
          if-no-files-found: error
```
