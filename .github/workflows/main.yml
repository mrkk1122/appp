````yaml
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build MRKK FastAPI Android APK
    runs-on: ubuntu-22.04

    steps:

      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 3. Setup Python
      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # 4. Install Android/Buildozer dependencies
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      # 5. Upgrade Python build tools
      - name: Upgrade Python tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel

      # 6. Install Buildozer
      - name: Install Buildozer
        run: |
          pip install buildozer
          pip install "cython==0.29.37"

      # 7. Check project files
      - name: Check Android project
        working-directory: ./mrkk-fastapi-android
        run: |
          echo "===== Project Directory ====="
          pwd

          echo "===== Files ====="
          find . -maxdepth 3 -type f | sort

          echo "===== Buildozer Spec ====="
          test -f buildozer.spec
          echo "buildozer.spec found"

          echo "===== Main Python ====="
          test -f main.py
          echo "main.py found"

      # 8. Build APK
      - name: Build APK
        working-directory: ./mrkk-fastapi-android
        run: |
          buildozer android debug

      # 9. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mrkk-fastapi-server-apk
          path: mrkk-fastapi-android/bin/*.apk
          if-no-files-found: error

### Repository structure

আপনার GitHub repository এখন এইভাবে থাকা উচিত:

```text
appp/
│
├── .github/
│   └── workflows/
│       └── main.yml
│
├── mrkk-fastapi-android/
│   ├── buildozer.spec
│   ├── main.py
│   ├── requirements.txt
│   │
│   ├── app/
│   │   ├── __init__.py
│   │   └── main.py
│   │
│   └── services/
│       └── fastapi_service.py
│
└── README.md
````

### এখন কী করবেন

1. GitHub → `appp`
2. `.github/workflows/main.yml`
3. **Edit**
4. পুরোনো সব code delete
5. উপরের complete code paste
6. **Commit changes**
7. **Actions**
8. **Build Android APK**
9. **Run workflow**
10. Build শেষ হওয়া পর্যন্ত অপেক্ষা করুন।

Build সফল হলে:

```text
Artifacts
└── mrkk-fastapi-server-apk
```

থেকে APK পাবেন।

**আরেকটা গুরুত্বপূর্ণ বিষয়:** এই workflow-এর `buildozer.spec` আপনার `mrkk-fastapi-android` folder-এর ভিতরে আছে ধরে নেওয়া হয়েছে। আপনার বর্তমান GitHub structure অনুযায়ী এটাই সঠিক path।

যদি এবার Buildozer-এর কোনো নতুন error আসে, **`Build APK` step-এর শেষ 30–50 lines এখানে দিন**। এরপর আমরা Android service/FastAPI অংশটা ঠিক করব।
