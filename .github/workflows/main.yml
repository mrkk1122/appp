
name: Android APK Build

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test Runner
        run: echo "GitHub Actions is working"

      - name: Check Project
        run: |
          echo "Current directory:"
          pwd
          echo "Project files:"
          find . -maxdepth 3 -type f | sort
          echo "Checking buildozer.spec..."
          test -f mrkk-fastapi-android/buildozer.spec
          echo "buildozer.spec OK"
          echo "Checking main.py..."
          test -f mrkk-fastapi-android/main.py
          echo "main.py OK"
```
