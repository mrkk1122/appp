
name: MRKK FastAPI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel
          python -m pip install buildozer
          python -m pip install "Cython==0.29.37"

      - name: Verify Android project
        run: |
          echo "Checking project..."

          test -f mrkk-fastapi-android/buildozer.spec
          test -f mrkk-fastapi-android/main.py

          echo "buildozer.spec found"
          echo "main.py found"

          echo "Project structure:"
          find mrkk-fastapi-android -maxdepth 3 -type f | sort

      - name: Build Android APK
        working-directory: mrkk-fastapi-android
        run: |
          buildozer -v android debug

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find mrkk-fastapi-android/bin -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mrkk-fastapi-server-apk
          path: mrkk-fastapi-android/bin/*.apk
          if-no-files-found: error
