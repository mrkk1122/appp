```yaml
name: Android APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test Runner
        run: |
          echo "GitHub Actions is working"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"

      - name: Check Project
        run: |
          echo "Root directory:"
          pwd

          echo ""
          echo "Repository files:"
          find . -maxdepth 3 -type f | sort

          echo ""
          echo "Checking Buildozer project..."

          test -f mrkk-fastapi-android/buildozer.spec
          echo "buildozer.spec: OK"

          test -f mrkk-fastapi-android/main.py
          echo "main.py: OK"
```
